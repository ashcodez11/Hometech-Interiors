<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Project image viewer" aria-hidden="true" hidden>
  <div class="lightbox__bar">
    <span class="lightbox__count" data-lightbox-count>1 / 1</span>
    <div class="lightbox__controls">
      <button class="lightbox__btn" type="button" data-lightbox-prev aria-label="Previous image">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <button class="lightbox__btn" type="button" data-lightbox-next aria-label="Next image">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </button>
      <button class="lightbox__btn" type="button" data-lightbox-close aria-label="Close viewer">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg>
      </button>
    </div>
  </div>
  <div class="lightbox__stage">
    <figure class="lightbox__figure">
      <img data-lightbox-image src="" alt="">
      <figcaption>
        <span class="lightbox__title" data-lightbox-title></span>
        <span data-lightbox-caption></span>
      </figcaption>
    </figure>
  </div>
</div>
