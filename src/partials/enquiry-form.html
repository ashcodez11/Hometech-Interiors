<form class="form" id="enquiry-form" data-whatsapp="{{site.whatsapp}}" data-thanks="thank-you.html" novalidate>
  <div class="form__row form__row--2">
    <div class="field">
      <label for="f-name">Name <span class="req" aria-hidden="true">*</span></label>
      <input id="f-name" name="name" type="text" autocomplete="name" required placeholder="Your name" aria-invalid="false" aria-describedby="e-name">
      <p class="field__error" id="e-name" data-error-for="name" role="alert"></p>
    </div>
    <div class="field">
      <label for="f-phone">Phone <span class="req" aria-hidden="true">*</span></label>
      <input id="f-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" required placeholder="10-digit mobile number" aria-invalid="false" aria-describedby="e-phone">
      <p class="field__error" id="e-phone" data-error-for="phone" role="alert"></p>
    </div>
  </div>

  <div class="form__row form__row--2">
    <div class="field">
      <label for="f-email">Email</label>
      <input id="f-email" name="email" type="email" autocomplete="email" placeholder="Optional" aria-invalid="false" aria-describedby="e-email">
      <p class="field__error" id="e-email" data-error-for="email" role="alert"></p>
    </div>
    <div class="field">
      <label for="f-service">Service <span class="req" aria-hidden="true">*</span></label>
      <select id="f-service" name="service" required aria-invalid="false" aria-describedby="e-service">
        <option value="">Select a service</option>
        <option value="Modular Kitchen">Modular Kitchen</option>
        <option value="Wardrobe">Wardrobe</option>
        <option value="False Ceiling">False Ceiling</option>
        <option value="Interior Works">Interior Works</option>
      </select>
      <p class="field__error" id="e-service" data-error-for="service" role="alert"></p>
    </div>
  </div>

  <div class="field">
    <label for="f-message">Message</label>
    <textarea id="f-message" name="message" rows="5" placeholder="Tell us about your space — rooms, approximate size, and what you would like done."></textarea>
    <p class="field__hint">Sharing a few details helps us respond with something useful.</p>
  </div>

  <div class="form__foot">
    <button class="btn btn--primary" type="submit">Send Enquiry</button>
    <p class="form__status" data-form-status role="status" hidden></p>
    <p class="form__note">
      This demonstration form does not store anything on a server. When you press send, your enquiry is
      prepared for WhatsApp so you can review it before it is sent. You can also call
      <a href="{{site.phoneHref}}">{{site.phoneDisplay}}</a> directly.
    </p>
  </div>
</form>
